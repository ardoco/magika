name: Deploy Snapshot

on:
  # Manual trigger only: deploys the selected branch to the GitLab package registry
  workflow_dispatch:

jobs:
  deploy:
    uses: ardoco/actions/.github/workflows/maven-snapshot.yml@main
    with:
      # Maven package registry of the read-only mirror on gitlab.kit.edu (kit/kastel/sdq/research-projects/ardoco/magika)
      gitlab-project-id: "203215"
    secrets: inherit
