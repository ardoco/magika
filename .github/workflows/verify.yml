name: Maven Verify

on:
  push: # Ignore releases and main dev branch
    tags-ignore:
      - 'v*'
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Java version
      id: jve
      shell: bash
      run: |
        for expr in maven.compiler.target maven.compiler.release java.version; do
          v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
          v=${v#1.}
          if [[ "$v" =~ ^[0-9]+ ]]; then
            echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::Could not determine the Java version from the POM"
        exit 1

    - name: Java with Cache
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.jve.outputs.java_major_version }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Maven Verify
      shell: bash
      run: mvn -U -B verify
